services:
  obe-mysql:
    image: mysql:8.0.26
    container_name: obe-mysql
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: Qzb123456*
    ports:
      - "3308:3306"
    volumes:
      - "/works/course-oss/mysql/data:/var/lib/mysql"
    networks:
      - obe-net
    restart: unless-stopped  # 核心：配置重启策略
  obe-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: obe-backend
    volumes:
      - "/works/course-oss/logs/backend:/app/logs"  # 挂载后端日志（可选）
    depends_on:
      - obe-mysql
    ports:
      - "8080:8080"
    networks:
      - obe-net
    restart: unless-stopped  # 核心：配置重启策略
  obe-nginx:
    image: nginx
    container_name: obe-nginx
    ports:
      - "5173:5173"
    volumes:
      - "/works/course-oss/nginx/nginx.conf:/etc/nginx/nginx.conf"
      - "/works/course-oss/nginx/logs:/var/log/nginx"
      - "/works/course-oss/frontend:/usr/share/nginx/html/frontend"  # 挂载Vue静态文件
    depends_on:
      - obe-backend
    networks:
      - obe-net
    restart: unless-stopped  # 核心：配置重启策略

networks:
  obe-net:
    driver: bridge